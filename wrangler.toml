# For God so loved the world, that He gave His only begotten Son,
# that all who believe in Him should not perish but have everlasting life. — John 3:16

name = "openorphanage-org-chirho"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

account_id = "aecd5616f7ef88323e52b6406ba384bd"

routes = [
    { pattern = "openorphanage.org", custom_domain = true }
]

[assets]
directory = ".svelte-kit/cloudflare"

[dev]
port = 5183

# D1 Database for orphanage data
[[d1_databases]]
binding = "DB_CHIRHO"
database_name = "openorphanage-chirho"
database_id = "2202fc9a-27e5-4302-94a0-8fe96f083e50"

# KV for sessions, large text, rate limiting
[[kv_namespaces]]
binding = "KV_CHIRHO"
id = "59c04cea3ad143eaaac816034a42cfb1"

# R2 for media files (photos, documents)
[[r2_buckets]]
bucket_name = "openorphanage-media-chirho"
binding = "R2_CHIRHO"

# Environment variables (secrets set via wrangler secret put)
[vars]
EMAIL_FROM_CHIRHO = "noreply.fe@openorphanage.org"
EMAIL_SUPPORT_CHIRHO = "support.fe@openorphanage.org"
EMAIL_ADMIN_CHIRHO = "admin.fe@openorphanage.org"
SITE_URL_CHIRHO = "https://openorphanage.org"
SITE_NAME_CHIRHO = "OpenOrphanage"
# Turnstile site key (public - get from Cloudflare dashboard)
TURNSTILE_SITE_KEY_CHIRHO = "0x4AAAAAABOuFJKGBcxhGmXa"

# Note: Set these secrets via wrangler secret put:
# wrangler secret put MASTER_2SMTP_API_KEY_CHIRHO
# wrangler secret put MAILU_API_TOKEN_CHIRHO
# wrangler secret put SESSION_SECRET_CHIRHO
# wrangler secret put TURNSTILE_SECRET_KEY_CHIRHO
# wrangler secret put KINGDOM_INVEST_WEBHOOK_SECRET_CHIRHO
